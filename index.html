<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC3C Photobooth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CONTAINER UTAMA -->
    <div class="app-container">

        <!-- ================= PAGE 1: LOGIN ================= -->
        <div id="loginPage" class="page active">
            <div class="card">
                <div class="logo-icon">⚡</div>
                <div class="badge">EC-3C</div>
                <h1>EC3C PHOTOBOOTH</h1>
                <p class="subtitle">Sistem Verifikasi Anak EC3C</p>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="nim">NIM</label>
                        <input type="text" id="nim" placeholder="Masukkan NIM..." required autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="nama">NAMA LENGKAP</label>
                        <input type="text" id="nama" placeholder="Masukkan nama..." required autocomplete="off">
                    </div>

                    <div id="loginError" class="error-text"></div>

                    <button type="submit" class="btn-primary">MASUK KE EC3C &rarr;</button>
                </form>
            </div>
        </div>

        <!-- ================= PAGE 2: QUIZ ================= -->
        <div id="quizPage" class="page">
            <div class="card">
                <div class="user-greeting">Halo, <span id="displayNama"></span>!</div>
                <div id="questionNumber" class="badge">PERTANYAAN 1 / 5</div>
                
                <h2 id="questionText" class="question-title">Loading...</h2>

                <div id="questionImage" class="quiz-image-container" style="display: none;">
                    <img id="quizImage" src="" alt="Soal Gambar">
                </div>

                <form id="quizForm">
                    <div class="input-group">
                        <input type="text" id="answer" placeholder="Ketik jawabanmu..." required autocomplete="off">
                    </div>

                    <div id="quizError" class="error-text"></div>

                    <button type="submit" class="btn-primary">JAWAB &rarr;</button>
                </form>
            </div>
        </div>

        <!-- ================= PAGE 3: CAMERA ================= -->
        <div id="cameraPage" class="page">
            <div class="card camera-card">
                <div id="photoCounter" class="badge">0 / 6 FOTO</div>
                
                <div class="camera-wrapper">
                    <video id="camera" autoplay playsinline muted></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <div id="countdown" class="countdown-overlay"></div>
                </div>

                <div id="cameraError" class="error-text"></div>

                <button id="snapButton" class="btn-primary">MULAI FOTO 📸</button>
            </div>
        </div>

        <!-- ================= PAGE 4: RESULT ================= -->
        <div id="resultPage" class="page">
            <div class="card result-card">
                <h2>HASIL PHOTOBOOTH</h2>
                <div id="resultName" class="user-greeting">User: -</div>

                <div class="strips-preview">
                    <!-- Strip 1 -->
                    <div class="strip">
                        <div class="strip-header">⚡ EC3C ⚡</div>
                        <div class="strip-title">EC3C PHOTOBOOTH</div>
                        <div class="strip-photos">
                            <img id="result0" src="" alt="Foto 1">
                            <img id="result1" src="" alt="Foto 2">
                            <img id="result2" src="" alt="Foto 3">
                        </div>
                        <div id="date1" class="strip-date"></div>
                        <div class="strip-footer">CLASS OF EC3C</div>
                    </div>

                    <!-- Strip 2 -->
                    <div class="strip">
                        <div class="strip-header">⚡ EC3C ⚡</div>
                        <div class="strip-title">EC3C PHOTOBOOTH</div>
                        <div class="strip-photos">
                            <img id="result3" src="" alt="Foto 4">
                            <img id="result4" src="" alt="Foto 5">
                            <img id="result5" src="" alt="Foto 6">
                        </div>
                        <div id="date2" class="strip-date"></div>
                        <div class="strip-footer">CLASS OF EC3C</div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="downloadButton" class="btn-primary">SIMPAN STRIP FOTO 💾</button>
                    <button id="restartButton" class="btn-secondary">FOTO LAGI 🔄</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
