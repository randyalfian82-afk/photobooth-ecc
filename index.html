<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC3C Photobooth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">

        <!-- LOGIN -->
        <section id="loginPage" class="page active">
            <div class="card">
                <div class="logo-icon">⚡</div>
                <div class="badge">EC-3C</div>

                <h1>EC3C PHOTOBOOTH</h1>
                <p class="subtitle">Sistem Verifikasi Anak EC3C</p>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="nim">NIM</label>
                        <input
                            type="text"
                            id="nim"
                            placeholder="Masukkan NIM..."
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="nama">NAMA LENGKAP</label>
                        <input
                            type="text"
                            id="nama"
                            placeholder="Masukkan nama..."
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div id="loginError" class="error-text"></div>

                    <button type="submit" class="btn-primary">
                        MASUK KE EC3C →
                    </button>
                </form>
            </div>
        </section>

        <!-- QUIZ -->
        <section id="quizPage" class="page">
            <div class="card">
                <div class="user-greeting">
                    Halo, <span id="displayNama"></span>!
                </div>

                <div id="questionNumber" class="badge">
                    PERTANYAAN 1 / 5
                </div>

                <h2 id="questionText" class="question-title">
                    Loading...
                </h2>

                <div id="questionImage" class="quiz-image-container">
                    <img id="quizImage" src="" alt="Gambar pertanyaan">
                </div>

                <form id="quizForm">
                    <div class="input-group">
                        <input
                            type="text"
                            id="answer"
                            placeholder="Ketik jawabanmu..."
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div id="quizError" class="error-text"></div>

                    <button type="submit" class="btn-primary">
                        JAWAB →
                    </button>
                </form>
            </div>
        </section>

        <!-- CAMERA -->
        <section id="cameraPage" class="page">
            <div class="card camera-card">
                <div id="photoCounter" class="badge">
                    0 / 6 FOTO
                </div>

                <div class="camera-wrapper">
                    <video id="camera" autoplay playsinline muted></video>
                    <canvas id="canvas"></canvas>
                    <div id="countdown" class="countdown-overlay"></div>
                </div>

                <div id="cameraError" class="error-text"></div>

                <button id="snapButton" class="btn-primary">
                    MULAI FOTO 📸
                </button>
            </div>
        </section>

        <!-- RESULT -->
        <section id="resultPage" class="page">
            <div class="card result-card">
                <h2>HASIL PHOTOBOOTH</h2>

                <div id="resultName" class="user-greeting">
                    User: -
                </div>

                <div class="strips-preview">

                    <div class="strip">
                        <div class="strip-header">⚡ EC3C ⚡</div>
                        <div class="strip-title">EC3C PHOTOBOOTH</div>

                        <div class="strip-photos">
                            <img id="result0" src="" alt="Foto 1">
                            <img id="result1" src="" alt="Foto 2">
                            <img id="result2" src=""
