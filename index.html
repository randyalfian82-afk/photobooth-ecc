<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Quiz EC3C</title>
    <!-- Library untuk download area HTML menjadi Gambar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ==================================================
           DASAR & BACKGROUND
        ================================================== */
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #d9faff;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 220, 255, 0.15),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(120, 0, 255, 0.15),
                    transparent 25%
                ),
                linear-gradient(
                    135deg,
                    #07111d,
                    #0b1d2c 45%,
                    #06101a
                );
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.35;
            background-image:
                linear-gradient(
                    90deg,
                    transparent 48%,
                    rgba(0, 220, 255, 0.12) 49%,
                    rgba(0, 220, 255, 0.12) 51%,
                    transparent 52%
                ),
                linear-gradient(
                    transparent 48%,
                    rgba(0, 220, 255, 0.12) 49%,
                    rgba(0, 220, 255, 0.12) 51%,
                    transparent 52%
                );
            background-size: 80px 80px;
            z-index: -2;
        }

        body::after {
            content: "⚡ ━━━●━━━━━━━●━━━━ IC ━━━●━━━━━━●━━━ ⚡";
            position: fixed;
            left: 0;
            top: 10%;
            width: 100%;
            color: rgba(70, 230, 255, 0.12);
            font-size: 25px;
            letter-spacing: 8px;
            white-space: nowrap;
            pointer-events: none;
            animation: circuitMove 15s linear infinite;
            z-index: -1;
        }

        @keyframes circuitMove {
            from { transform: translateX(-20%); }
            to { transform: translateX(20%); }
        }

        /* ==================================================
           HALAMAN
        ================================================== */
        .page {
            min-height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .page.active {
            display: flex;
        }

        /* ==================================================
           DEKORASI SIRKUIT & CARD
        ================================================== */
        .circuit-decoration {
            color: #55e8ff;
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(50, 220, 255, 0.8);
            opacity: 0.8;
            margin: 15px;
            text-align: center;
        }

        .card {
            width: 90%;
            max-width: 430px;
            padding: 30px;
            background: linear-gradient(
                145deg,
                rgba(12, 31, 47, 0.97),
                rgba(7, 19, 31, 0.97)
            );
            border: 1px solid rgba(65, 225, 255, 0.35);
            border-radius: 20px;
            text-align: center;
            box-shadow:
                0 0 25px rgba(0, 210, 255, 0.12),
                0 20px 50px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                #55e8ff,
                transparent
            );
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .electronic-icon {
            font-size: 45px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 12px rgba(0, 230, 255, 0.7));
            animation: pulseElectronic 2s ease-in-out infinite;
        }

        @keyframes pulseElectronic {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .card h1 {
            margin: 5px 0 10px;
            font-size: 28px;
            color: #d9faff;
            text-shadow: 0 0 12px rgba(70, 220, 255, 0.35);
        }

        .subtitle {
            color: #8db9c5;
            margin-bottom: 20px;
            line-height: 1.5;
            font-size: 14px;
        }

        .user-info {
            display: inline-block;
            padding: 7px 14px;
            margin-bottom: 10px;
            border-radius: 20px;
            background: rgba(50, 220, 255, 0.08);
            border: 1px solid rgba(50, 220, 255, 0.25);
            color: #64eaff;
            font-size: 12px;
            font-family: monospace;
        }

        /* ==================================================
           FORM & BUTTON
        ================================================== */
        label {
            display: block;
            text-align: left;
            margin-top: 14px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #9ed4df;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #285465;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
            color: #dffaff;
            background: #081722;
            transition: 0.25s;
        }

        input::placeholder {
            color: #557783;
        }

        input:focus {
            border-color: #4de8ff;
            box-shadow: 0 0 15px rgba(50, 220, 255, 0.15);
        }

        button {
            border: none;
            padding: 14px 25px;
            margin-top: 20px;
            border-radius: 8px;
            background: linear-gradient(135deg, #0c8ca8, #126078);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 15px rgba(0, 220, 255, 0.15);
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 220, 255, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-download {
            background: linear-gradient(135deg, #28a745, #1e7e34);
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .error-message {
            color: #ff6b91;
            font-weight: bold;
            min-height: 20px;
            margin-top: 12px;
            font-size: 13px;
        }

        .question-number {
            color: #53dff5;
            font-size: 13px;
            font-family: monospace;
        }

        #judulPertanyaan {
            font-size: 20px;
            line-height: 1.4;
            margin: 15px 0 10px;
            color: #dffaff;
        }

        /* Gambar Pertanyaan */
        .question-image-box {
            width: 100%;
            max-height: 220px;
            margin: 10px 0 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(70, 220, 255, 0.3);
            display: none;
        }

        .question-image-box.active {
            display: block;
        }

        .question-image-box img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        /* ==================================================
           PHOTOBOOTH & KAMERA
        ================================================== */
        #photobooth {
            text-align: center;
        }

        .camera-container {
            position: relative;
            width: 90%;
            max-width: 600px;
            background: #02070b;
            border: 2px solid #1c8095;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 220, 255, 0.2);
            margin: 20px auto;
        }

        .camera-label {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 3;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.65);
            color: #ff526f;
            font-family: monospace;
            font-size: 11px;
        }

        #camera {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 20px #00d9ff;
        }

        #canvas {
            display: none;
        }

        .camera-button {
            background: linear-gradient(135deg, #e04d72, #a83255);
            padding: 15px 30px;
            width: auto;
        }

        /* ==================================================
           HASIL POLAROID
        ================================================== */
        #hasilPage {
            justify-content: flex-start;
            padding-top: 35px;
            text-align: center;
        }

        .download-area {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            padding: 20px;
            background: #07111d;
        }

        .polaroid-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            padding: 15px;
        }

        .photostrip {
            width: 250px;
            padding: 12px 12px 18px;
            background: linear-gradient(180deg, #d8faff, #b9eaf2);
            border-radius: 5px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .photostrip-header {
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #07151f;
            margin-bottom: 10px;
        }

        .cat-decoration {
            font-size: 25px;
        }

        .photostrip-title {
            text-align: center;
            color: #173c4a;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .photo-box {
            width: 100%;
            background: white;
            padding: 4px;
            margin-bottom: 8px;
        }

        .photo-box img {
            width: 100%;
            display: block;
        }

        .photostrip-footer {
            text-align: center;
            color: #173c4a;
            font-family: monospace;
            font-weight: bold;
            font-size: 12px;
            margin-top: 10px;
        }

        .photostrip-date {
            font-size: 9px;
            color: #507482;
            margin-top: 3px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 40px;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .polaroid-container { gap: 10px; }
            .photostrip { width: 44vw; padding: 8px; }
        }
    </style>
</head>
<body>

    <!-- 1. HALAMAN REGISTRASI & VALIDASI NIM -->
    <div id="registrasiPage" class="page active">
        <div class="circuit-decoration">⚡ [ EC3C PHOTOBOOTH SYSTEM ] ⚡</div>
        <div class="card">
            <div class="electronic-icon">🔌</div>
            <h1>Registrasi</h1>
            <p class="subtitle">Masukan Nama Lengkap & NIM Kamu!</p>
            
            <label for="inputNama">Nama Lengkap:</label>
            <input type="text" id="inputNama" placeholder="Contoh: Yuan Rizqy Pratama" autocomplete="off">
            
            <label for="inputNim">NIM (Nomor Induk Mahasiswa):</label>
            <input type="text" id="inputNim" placeholder="Contoh: 2503321077" autocomplete="off">
            
            <div id="errRegistrasi" class="error-message"></div>
            <button onclick="submitRegistrasi()">LANJUT KE QUIZ ➔</button>
        </div>
    </div>

    <!-- 2. HALAMAN PERTANYAAN -->
    <div id="pertanyaanPage" class="page">
        <div class="card">
            <div id="displayNamaUser" class="user-info">User: -</div>
            <div id="nomorPertanyaan" class="question-number">PERTANYAAN 1 / 3</div>
            
            <h2 id="judulPertanyaan">Fungsi resistor?</h2>
            
            <!-- Elemen Gambar Pertanyaan -->
            <div id="boxGambar" class="question-image-box">
                <img id="gambarPertanyaan" src="" alt="Gambar Pertanyaan">
            </div>

            <input type="text" id="inputJawaban" placeholder="Ketik jawabanmu di sini..." autocomplete="off">
            <div id="errPertanyaan" class="error-message"></div>
            
            <button onclick="submitJawaban()">JAWAB ➔</button>
        </div>
    </div>

    <!-- 3. HALAMAN PHOTOBOOTH -->
    <div id="photobooth" class="page">
        <h1>📸 PHOTOBOOTH READY</h1>
        <p>Sesi foto 6x snapshot otomatis!</p>
        <div id="photoCounter" class="user-info">0 / 6 Foto</div>

        <div class="camera-container">
            <div class="camera-label">● REC</div>
            <video id="camera" autoplay playsinline></video>
            <div id="countdown"></div>
        </div>

        <button id="btnStartBooth" class="camera-button" onclick="mulaiPhotobooth()">MULAI FOTO (3 Detik)</button>
        <canvas id="canvas"></canvas>
    </div>

    <!-- 4. HALAMAN HASIL -->
    <div id="hasilPage" class="page">
        <h1>🎉 HASIL PHOTOSTRIP EC3C 🎉</h1>
        <div id="hasilNamaUser" class="user-info">Subjek: -</div>

        <!-- Area Yang Akan Di-download -->
        <div id="captureArea" class="download-area">
            <div class="polaroid-container">
                <!-- Strip 1 -->
                <div class="photostrip">
                    <div class="photostrip-header"><span class="cat-decoration">⚡</span></div>
                    <div class="photostrip-title">EC3C MEMORIES</div>
                    <div id="fotoContainer1"></div>
                    <div class="photostrip-footer">
                        <div>PART 1</div>
                        <div id="tglPolaroid1" class="photostrip-date"></div>
                    </div>
                </div>

                <!-- Strip 2 -->
                <div class="photostrip">
                    <div class="photostrip-header"><span class="cat-decoration">⚡</span></div>
                    <div class="photostrip-title">EC3C MEMORIES</div>
                    <div id="fotoContainer2"></div>
                    <div class="photostrip-footer">
                        <div>PART 2</div>
                        <div id="tglPolaroid2" class="photostrip-date"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-download" onclick="downloadFoto()">💾 SIMPAN / DOWNLOAD FOTO</button>
            <button style="background: transparent; border: 1px solid #27798b; color: #61e8ff;" onclick="ulangSemua()">🔄 Ulangi Dari Awal</button>
        </div>
    </div>

    <!-- JAVASCRIPT SYSTEM -->
    <script>
        // DATA MAHASISWA DARI GAMBAR TABEL
        const dataMahasiswa = [
            { nim: "2503321002", nama: "abdul fattah" },
            { nim: "2503321073", nama: "abyan dwi setiawan" },
            { nim: "2503321092", nama: "alfian randy" },
            { nim: "2503321094", nama: "cahya heryana" },
            { nim: "2503321050", nama: "danendra althaf" },
            { nim: "2503321058", nama: "evan okto fahmi romadhon" },
            { nim: "2503321066", nama: "fawwaz faishal alwan" },
            { nim: "2503321067", nama: "ghaisan adiend fathan al adli" },
            { nim: "2503321005", nama: "hanifa na'lla triya sumantri" },
            { nim: "2503321008", nama: "intan dhahy arwa admia fernando" },
            { nim: "2503321064", nama: "jusriadi" },
            { nim: "2503321013", nama: "maulana rafly abdullah" },
            { nim: "2503321004", nama: "muhamad rizhan faturahman" },
            { nim: "2503321049", nama: "muhammad addien fikrul akbar" },
            { nim: "2503321027", nama: "muhammad dzaki hisyam" },
            { nim: "2503321071", nama: "muhammad faiq satia prasaja" },
            { nim: "2503321040", nama: "muhammad farrel baddar pamuji" },
            { nim: "2503321084", nama: "muhammad rashya erlangga" },
            { nim: "2503321070", nama: "muhammad rizky ramadhan" },
            { nim: "2503321063", nama: "najwa sharfina muswar" },
            { nim: "2503321032", nama: "reyvan albaihaqi fasya" },
            { nim: "2503321025", nama: "shafa dhia alya judanti" },
            { nim: "2503321034", nama: "teuku naufal abyan" },
            { nim: "2503321077", nama: "yuan rizqy pratama" }
        ];

        // DAFTAR PERTANYAAN TERMASUK GAMBAR
        const daftarPertanyaan = [
            {
                teks: "Apa fungsi resistor?",
                gambar: "",
                validasi: (jawaban) => jawaban.includes("hambat"),
                pesanSalah: "Tolol!"
            },
            {
                teks: "Siapa nama lengkap orang di foto ini?",
                gambar: "yuan.jpg",
                validasi: (jawaban) => jawaban.includes("yuan"),
                pesanSalah: "Dongo!"
            },
            {
                teks: "Siapa nama maskot di kelas EC3C ini?",
                gambar: "cahya.jpg",
                validasi: (jawaban) => jawaban.includes("cahya") || jawaban.includes("bule"),
                pesanSalah: "Yah masa ga kenal sih!"
            }
        ];

        let indeksPertanyaan = 0;
        let namaUser = "";
        let nimUser = "";
        let fotoTerambil = [];
        let mediaStream = null;

        // ELEMENT DOM
        const registrasiPage = document.getElementById('registrasiPage');
        const pertanyaanPage = document.getElementById('pertanyaanPage');
        const photoboothPage = document.getElementById('photobooth');
        const hasilPage = document.getElementById('hasilPage');

        const inputNama = document.getElementById('inputNama');
        const inputNim = document.getElementById('inputNim');
        const errRegistrasi = document.getElementById('errRegistrasi');
        const displayNamaUser = document.getElementById('displayNamaUser');

        const nomorPertanyaanEl = document.getElementById('nomorPertanyaan');
        const judulPertanyaanEl = document.getElementById('judulPertanyaan');
        const boxGambarEl = document.getElementById('boxGambar');
        const gambarPertanyaanEl = document.getElementById('gambarPertanyaan');
        const inputJawaban = document.getElementById('inputJawaban');
        const errPertanyaan = document.getElementById('errPertanyaan');

        const cameraVideo = document.getElementById('camera');
        const canvasEl = document.getElementById('canvas');
        const countdownEl = document.getElementById('countdown');
        const photoCounterEl = document.getElementById('photoCounter');
        const btnStartBooth = document.getElementById('btnStartBooth');

        // 1. REGISTRASI & VALIDASI NIM
        function submitRegistrasi() {
            const namaVal = inputNama.value.trim().toLowerCase();
            const nimVal = inputNim.value.trim();

            if (!namaVal || !nimVal) {
                errRegistrasi.textContent = "Nama dan NIM wajib diisi!";
                return;
            }

            const mhsFound = dataMahasiswa.find(m => m.nim === nimVal);

            if (!mhsFound) {
                errRegistrasi.textContent = "NIM tidak ditemukan dalam data EC3C!";
                return;
            }

            if (!mhsFound.nama.includes(namaVal) && !namaVal.includes(mhsFound.nama.split(" ")[0])) {
                errRegistrasi.textContent = "Nama dan NIM tidak cocok!";
                return;
            }

            namaUser = inputNama.value.trim();
            nimUser = nimVal;
            errRegistrasi.textContent = "";
            displayNamaUser.textContent = `User: ${namaUser} (${nimUser})`;
            
            registrasiPage.classList.remove('active');
            pertanyaanPage.classList.add('active');
            muatPertanyaan();
        }

        // 2. TAMPILKAN PERTANYAAN & GAMBAR
        function muatPertanyaan() {
            const item = daftarPertanyaan[indeksPertanyaan];
            nomorPertanyaanEl.textContent = `PERTANYAAN ${indeksPertanyaan + 1} / ${daftarPertanyaan.length}`;
            judulPertanyaanEl.textContent = item.teks;
            
            if (item.gambar) {
                gambarPertanyaanEl.src = item.gambar;
                boxGambarEl.classList.add('active');
            } else {
                boxGambarEl.classList.remove('active');
            }

            inputJawaban.value = "";
            errPertanyaan.textContent = "";
        }

        // 3. VALIDASI JAWABAN
        function submitJawaban() {
            const jawabanUser = inputJawaban.value.trim().toLowerCase();
            const itemPertanyaan = daftarPertanyaan[indeksPertanyaan];

            if (!jawabanUser) {
                errPertanyaan.textContent = "Isi jawabanmu dulu!";
                return;
            }

            if (itemPertanyaan.validasi(jawabanUser)) {
                errPertanyaan.textContent = "";
                indeksPertanyaan++;

                if (indeksPertanyaan < daftarPertanyaan.length) {
                    muatPertanyaan();
                } else {
                    pertanyaanPage.classList.remove('active');
                    photoboothPage.classList.add('active');
                    bukaKamera();
                }
            } else {
                errPertanyaan.textContent = itemPertanyaan.pesanSalah;
            }
        }

        // 4. KAMERA & PHOTOBOOTH
        async function bukaKamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: false
                });
                cameraVideo.srcObject = mediaStream;
            } catch (err) {
                alert("Gagal mengakses kamera: " + err.message);
            }
        }

        function mulaiPhotobooth() {
            btnStartBooth.disabled = true;
            fotoTerambil = [];
            photoCounterEl.textContent = "0 / 6 Foto";
            prosesFoto(0);
        }

        function prosesFoto(index) {
            if (index >= 6) {
                selesaiPhotobooth();
                return;
            }

            let hitungan = 3;
            countdownEl.textContent = hitungan;

            const timer = setInterval(() => {
                hitungan--;
                if (hitungan > 0) {
                    countdownEl.textContent = hitungan;
                } else {
                    clearInterval(timer);
                    countdownEl.textContent = "";
                    
                    tangkapGambar();
                    photoCounterEl.textContent = `${index + 1} / 6 Foto`;
                    
                    setTimeout(() => {
                        prosesFoto(index + 1);
                    }, 1000);
                }
            }, 1000);
        }

        function tangkapGambar() {
            const ctx = canvasEl.getContext('2d');
            canvasEl.width = cameraVideo.videoWidth;
            canvasEl.height = cameraVideo.videoHeight;

            ctx.translate(canvasEl.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(cameraVideo, 0, 0, canvasEl.width, canvasEl.height);

            const dataUrl = canvasEl.toDataURL('image/png');
            fotoTerambil.push(dataUrl);
        }

        function selesaiPhotobooth() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            photoboothPage.classList.remove('active');
            tampilkanHasil();
        }

        // 5. TAMPILKAN HASIL
        function tampilkanHasil() {
            hasilPage.classList.add('active');
            document.getElementById('hasilNamaUser').textContent = `Subjek: ${namaUser} (${nimUser})`;

            const boxP1 = document.getElementById('fotoContainer1');
            boxP1.innerHTML = "";
            for (let i = 0; i < 3; i++) {
                if (fotoTerambil[i]) {
                    boxP1.innerHTML += `<div class="photo-box"><img src="${fotoTerambil[i]}"></div>`;
                }
            }

            const boxP2 = document.getElementById('fotoContainer2');
            boxP2.innerHTML = "";
            for (let i = 3; i < 6; i++) {
                if (fotoTerambil[i]) {
                    boxP2.innerHTML += `<div class="photo-box"><img src="${fotoTerambil[i]}"></div>`;
                }
            }

            const skrg = new Date();
            const tglStr = skrg.toLocaleDateString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });
            document.getElementById('tglPolaroid1').textContent = tglStr;
            document.getElementById('tglPolaroid2').textContent = tglStr;
        }

        // 6. DOWNLOAD FOTO HASIL
        function downloadFoto() {
            const area = document.getElementById('captureArea');
            
            html2canvas(area, {
                scale: 2,
                backgroundColor: "#07111d"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Photobooth_EC3C_${namaUser.replace(/\s+/g, '_')}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function ulangSemua() {
            indeksPertanyaan = 0;
            namaUser = "";
            nimUser = "";
            fotoTerambil = [];
            btnStartBooth.disabled = false;
            
            hasilPage.classList.remove('active');
            registrasiPage.classList.add('active');
            inputNama.value = "";
            inputNim.value = "";
        }
    </script>
</body>
</html>
